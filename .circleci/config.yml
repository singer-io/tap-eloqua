version: 2
jobs:
  build:
    docker:
      - image: 218546966473.dkr.ecr.us-east-1.amazonaws.com/circle-ci:stitch-tap-tester-uv
    steps:
      - checkout
      - run:
          name: 'Setup virtual env'
          command: |
            uv venv --python 3.12 /usr/local/share/virtualenvs/tap-eloqua
            source /usr/local/share/virtualenvs/tap-eloqua/bin/activate
            uv pip install -U pip setuptools
            uv pip install .[dev]
      - run:
          name: 'JSON Validator'
          command: |
            source /usr/local/share/virtualenvs/tap-tester/bin/activate
            stitch-validate-json /usr/local/share/virtualenvs/tap-eloqua/lib/python3.12/site-packages/tap_eloqua/schemas/*.json
      - run:
          name: 'Pylint'
          command: |
            source /usr/local/share/virtualenvs/tap-eloqua/bin/activate
            pylint tap_eloqua --disable=C,R,W
      - run:
          name: 'Unit Tests'
          command: |
            source /usr/local/share/virtualenvs/tap-eloqua/bin/activate
            uv pip install pytest pytest-cov coverage
            mkdir -p test_output
            coverage run --source=tap_eloqua -m pytest tests/unittests -v \
              --junitxml=test_output/unit-report.xml
      - run:
          name: 'Integration Tests'
          command: |
            source /usr/local/share/virtualenvs/tap-tester/bin/activate
            source /usr/local/share/virtualenvs/tap-eloqua/bin/activate
            coverage run --source=tap_eloqua --append -m pytest tests/test_*.py -v \
              --junitxml=test_output/integration-report.xml
      - run:
          name: 'Coverage Report'
          command: |
            source /usr/local/share/virtualenvs/tap-eloqua/bin/activate
            coverage report -m --fail-under=100
            coverage html
      - store_test_results:
          path: test_output
      - store_artifacts:
          path: htmlcov
workflows:
  version: 2
  commit:
    jobs:
      - build:
          context: circleci-user
  build_daily:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - build:
          context: circleci-user
